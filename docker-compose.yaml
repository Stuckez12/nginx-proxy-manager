services:
  proxy:
    image: "jc21/nginx-proxy-manager:2.15.1"
    ports:
      - "80:80" # Public HTTP Port
      - "443:443" # Public HTTPS Port
      - "81:81" # Admin Web Port
    volumes:
      - ./data:/data
      - ./letsencrypt:/etc/letsencrypt
    restart: unless-stopped

volumes:
  data:
  letsencrypt:
